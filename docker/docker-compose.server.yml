name: xiaopi

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile.server
    container_name: xiaopi-api
    restart: unless-stopped
    network_mode: host
    working_dir: /workspace/backend
    environment:
      APP_ENV: production
      APP_NAME: Xiaopi
      APP_PORT: 18080
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-xiaopi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaopi_platform}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?JWT_ADMIN_SECRET is required}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:?WECHAT_MINI_APP_ID is required}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:?WECHAT_MINI_APP_SECRET is required}
      WECHAT_MOCK_ENABLED: ${WECHAT_MOCK_ENABLED:-false}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:?TENCENT_MAP_KEY is required}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_PUBLIC_BASE: ${COS_PUBLIC_BASE:-}
    volumes:
      - ../backend:/workspace/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: xiaopi-mysql
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaopi_platform}
      MYSQL_USER: ${MYSQL_USER:-xiaopi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - xiaopi_mysql_data:/var/lib/mysql
    command:
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p\"$${MYSQL_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: xiaopi-redis
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
    command: ["redis-server", "--appendonly", "yes", "--bind", "127.0.0.1", "--protected-mode", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4.8.1-standalone
    container_name: xiaopi-adminer
    restart: unless-stopped
    network_mode: host
    environment:
      ADMINER_DEFAULT_SERVER: 127.0.0.1
    command: ["php", "-S", "127.0.0.1:18081", "-t", "/var/www/html"]

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile.server
      args:
        VITE_API_BASE: https://api.xiaopizufang.cn/api
    container_name: xiaopi-admin
    restart: unless-stopped
    ports:
      - "15174:80"

volumes:
  xiaopi_mysql_data:
    name: xiaopi_mysql_data
